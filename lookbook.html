<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-solid="1">
<main id="main" class="container">
  <section style="padding:clamp(48px,6vw,80px) 0 28px">
    <span class="mono eyebrow" data-i18n="look.kicker"></span>
    <h1 class="display h-xl" style="margin-top:16px" data-i18n="look.title"></h1>
    <p class="lede" style="margin-top:16px" data-i18n="look.lede"></p>
  </section>
  <div class="masonry" id="look" style="padding-bottom:110px"></div>
</main>
<script>
document.addEventListener("og:ready", () => {
  const { $, img, t, Lightbox, reveal } = OG;
  const items = [["rd-1","radio-dreams"],["sf-3","static-frequency"],["ls-1","lost-souls"],["film-3","static-frequency"],["nf-2","new-future"],["sf-1","static-frequency"],["ls-2","lost-souls"],["nf-1","new-future"],["rd-2","radio-dreams"],["sf-4","static-frequency"],["nf-3","new-future"],["sf-2","static-frequency"]];
  const list = items.map(i => img(i[0]));
  $("#look").innerHTML = items.map(([s,id],i)=>`<figure class="look-item reveal"><button type="button" data-lb="${i}" aria-label="Lookbook ${i+1}"><img src="${img(s)}" alt="" loading="lazy"></button><a class="mono look-shop" href="product.html?id=${id}">${t("look.shop")} ↗</a></figure>`).join("");
  $("#look").addEventListener("click", e => { const b = e.target.closest("[data-lb]"); if (b) Lightbox.open(list, +b.dataset.lb); });
  reveal();
});
</script>
</body>
</html>
