<style>

body{margin:0;min-height:100vh;color:var(--navy);font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;

body::after{content:"";position:fixed;inset:0;background-image:var(--grain);opacity:.12;mix-blend-mode:multiply;pointer-events:none;z-index:50}
.mono{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase}
.display{font-weight:900;font-style:italic;font-stretch:125%;letter-spacing:-.04em;line-height:.92;margin:0}

header{position:sticky;top:0;z-index:20;background:rgba(242,234,219,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-style:italic;font-stretch:125%;font-size:22px;letter-spacing:-.03em}
.brand svg{width:16px;height:16px}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:none;background:none;min-width:44px;min-height:36px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;color:var(--navy)}
.lang button[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--navy);transition:width .5s var(--ease)}
.intro{padding:44px 0 24px}
.intro h1{font-size:clamp(40px,10vw,72px)}
.intro p{font-size:17px;max-width:560px;margin:18px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.chips span{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.4)}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:16px 0 4px;margin:0 -18px;padding-left:18px;padding-right:18px}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);cursor:pointer;white-space:nowrap}
.steps button[aria-current="step"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.steps button.done::before{content:"✓ "}
.card{background:rgba(243,240,232,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:28px;padding:26px 22px;margin:16px 0}
.card h2{font-size:clamp(30px,7vw,44px)}
.card .sub{color:var(--muted);margin:10px 0 0}
.q{display:flex;flex-direction:column;gap:8px;padding:20px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:none}
.q>label,.q>.label{font-weight:800;font-size:16px;line-height:1.35}
.q .help{color:var(--muted);font-size:14px;margin-top:-4px}
.req{color:var(--blue);margin-left:4px}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=number],input[type=date],textarea,select{width:100%;min-height:52px;padding:13px 16px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.65);font:inherit;font-size:16px;color:var(--navy);transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy);background:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.45);font-size:15px;transition:all .2s}

.opt input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}

.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e8dfcd;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .st{position:absolute;inset:auto 4px 4px 4px;font-size:10px;text-align:center;background:rgba(17,17,17,.7);color:#fff;border-radius:6px;padding:2px}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(17,17,17,.75);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.product{border:1.5px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;background:rgba(255,255,255,.3)}
.product-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.product .q{padding:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:1.5px solid transparent;font:inherit;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:transform .25s var(--ease),background .25s}
.btn:active{transform:scale(.98)}
.btn-dark{background:var(--ink);color:var(--paper)}
.btn-out{background:transparent;border-color:var(--navy);color:var(--navy)}
.btn-small{min-height:40px;padding:0 14px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:wait}
.nav{display:flex;gap:10px;justify-content:space-between;margin:8px 0 40px}
.nav .btn{flex:1}
.saved{text-align:center;color:var(--muted);margin:-24px 0 40px}
.err{color:var(--err);font-size:14px;display:none}
.q.invalid .err{display:block}
.q.invalid input,.q.invalid textarea,.q.invalid select{border-color:var(--err)}
.done{text-align:center;padding:60px 0 100px;display:flex;flex-direction:column;align-items:center;gap:18px}
.done svg{width:56px;height:56px}
.toast{visibility:hidden;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,150%);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;z-index:60;transition:transform .4s var(--ease);max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);visibility:visible}
[hidden]{display:none!important}
@media (min-width:700px){.card{padding:36px 40px}.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const tx = v => typeof v === "string" ? v : v[st.lang];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); $("#saved").textContent = "✓ " + T[st.lang].savedLocal; } catch(e){} };
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),3200); };

function fieldHTML(q, key, val, files) {
  const lab = esc(tx(q.l)) + (q.req ? '<span class="req" aria-hidden="true">✦</span>' : "");
  const help = q.h ? `<div class="help">${esc(tx(q.h))}</div>` : "";
  const ph = q.p ? ` placeholder="${esc(tx(q.p))}"` : "";
  const err = `<div class="err">${T[st.lang].required}</div>`;
  const id = "f_" + key.replace(/[^a-zA-Z0-9_]/g,"_");
  if (["text","tel","email","url","number"].includes(q.type)) {
    const v = val ?? q.v ?? "";
    const im = q.type==="number" ? ' inputmode="numeric"' : "";
    return `<div class="q" data-key="${key}"${q.req?' data-req="1"':""}><label for="${id}">${lab}</label>${help}<input id="${id}" type="${q.type==="number"?"text":q.type}"${im} name="${key}" value="${esc(v)}"${ph}>${err}</div>`;
  }
  if (q.type==="textarea") return `<div class="q" data-key="${key}"${q.req?' data-req="1"':""}><label for="${id}">${lab}</label>${help}<textarea id="${id}" name="${key}"${ph}>${esc(val ?? q.v ?? "")}</textarea>${err}</div>`;
  if (q.type==="radio" || q.type==="checks") {
    const sel = Array.isArray(val) ? val : (val ? [val] : []);
    const opts = q.o.map(o => { const v = typeof o==="string" ? o : o.fr; return `<label class="opt"><input type="${q.type==="radio"?"radio":"checkbox"}" name="${key}" value="${esc(v)}"${sel.includes(v)?" checked":""}><span>${esc(tx(o))}</span></label>`; }).join("");
    return `<div class="q" data-key="${key}"${q.req?' data-req="1"':""} role="group" aria-labelledby="${id}"><div class="label" id="${id}">${lab}</div>${help}<div class="opts">${opts}</div>${err}</div>`;
  }
  if (q.type==="file") {
    const list = files || [];
    return `<div class="q" data-key="${key}"><div class="label">${lab}</div>${help}
      <label class="drop"><input type="file" multiple accept="image/*,.pdf,.svg" data-file="${key}"><strong>${T[st.lang].drop}</strong><span class="mono" style="font-size:10px">${T[st.lang].dropSub}</span></label>
      <div class="thumbs" data-thumbs="${key}">${list.map((f,i)=>thumbHTML(key,f,i)).join("")}</div></div>`;
  }
  return "";
}
function thumbHTML(key,f,i){
  const isImg = /\.(jpe?g|png|webp|svg)$/i.test(f.name||"") || (f.url||"").match(/\.(jpe?g|png|webp|svg)/i);
  return `<div class="thumb">${isImg && f.url ? `<img src="${esc(f.url)}" alt="">` : `<div class="mono" style="padding:8px;font-size:9px;word-break:break-all">${esc(f.name)}</div>`}${f.state?`<div class="st">${f.state}</div>`:""}<button type="button" aria-label="${T[st.lang].remove}" data-rmfile="${key}" data-i="${i}">×</button></div>`;
}
function productsHTML(){
  return st.products.map((p,pi) => `<div class="product" data-pi="${pi}">
    <div class="product-head"><span class="display" style="font-size:24px">${T[st.lang].product} ${pi+1}</span>${st.products.length>1?`<button type="button" class="btn btn-out btn-small" data-rmprod="${pi}">${T[st.lang].remove}</button>`:""}</div>
    ${PRODUCT_Q.map(q => fieldHTML(q, `p${pi}.${q.id}`, p[q.id], st.f[`p${pi}.${q.id}`])).join("")}
  </div>`).join("") + `<button type="button" class="btn btn-out" id="addprod" style="width:100%">${T[st.lang].addProduct}</button>`;
}
function render(){
  document.documentElement.lang = st.lang;
  $$("[data-t]").forEach(e => e.textContent = T[st.lang][e.dataset.t]);
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===st.lang));
  $("#steps").innerHTML = S.map((s,i)=>`<button type="button" data-step="${i}"${i===st.step?' aria-current="step"':""} class="${st.done.includes(i)&&i!==st.step?"done":""}">${i+1} · ${esc(tx(s.t))}</button>`).join("");
  const s = S[st.step];
  const body = s.q.map(q => q.type==="products" ? productsHTML() : fieldHTML(q, q.id, st.a[q.id], st.f[q.id])).join("");
  const last = st.step === S.length-1;
  $("#form").innerHTML = `<section class="card"><span class="mono">${st.step+1} / ${S.length}</span><h2 class="display" style="margin-top:10px">${esc(tx(s.t))}</h2><p class="sub">${esc(tx(s.s))}</p>${body}</section>
    <div class="nav">${st.step>0?`<button type="button" class="btn btn-out" id="prev">${T[st.lang].prev}</button>`:""}
    <button type="${last?"submit":"button"}" class="btn btn-dark" id="${last?"send":"next"}">${last?T[st.lang].send:T[st.lang].next} →</button></div>`;
  $("#prog").style.width = ((st.step+1)/S.length*100) + "%";
  $("#intro").hidden = st.step !== 0;
}
function collect(){
  $$("#form .q").forEach(q => {
    const key = q.dataset.key; if (!key || q.querySelector("[data-file]")) return;
    const inputs = $$("input,textarea,select", q);
    let v;
    if (inputs[0] && inputs[0].type==="checkbox") v = inputs.filter(i=>i.checked).map(i=>i.value);
    else if (inputs[0] && inputs[0].type==="radio") v = (inputs.find(i=>i.checked)||{}).value || "";
    else v = inputs[0] ? inputs[0].value.trim() : "";
    if (key.startsWith("p") && key.includes(".")) { const [pp,f]=key.split("."); const pi=+pp.slice(1); (st.products[pi] ||= {})[f]=v; }
    else st.a[key]=v;
  });
  save();
}
function validate(){
  let ok = true, first;
  $$("#form .q[data-req]").forEach(q => {
    const inputs = $$("input,textarea", q);
    const filled = inputs.some(i => (i.type==="checkbox"||i.type==="radio") ? i.checked : i.value.trim());
    q.classList.toggle("invalid", !filled); if (!filled && !first) first = q; if(!filled) ok=false;
  });
  if (first) { first.scrollIntoView({behavior:"smooth",block:"center"}); toast(T[st.lang].fixErr); }
  return ok;
}
function go(i){ collect(); st.step = Math.max(0, Math.min(S.length-1, i)); save(); render(); scrollTo({top:0,behavior:"smooth"}); }

// image compression
function compress(file){
  return new Promise((resolve) => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 900000) { const r=new FileReader(); r.onload=()=>resolve({type:file.type,data:r.result.split(",")[1],name:file.name}); r.readAsDataURL(file); return; }
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 2200, sc = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      const keepPng = file.type==="image/png" && /logo/i.test(file.name);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const type = keepPng ? "image/png" : "image/jpeg";
      const data = c.toDataURL(type, .86).split(",")[1];
      URL.revokeObjectURL(url);
      resolve({type, data, name: file.name.replace(/\.\w+$/, type==="image/png"?".png":".jpg")});
    };
    img.onerror = () => { const r=new FileReader(); r.onload=()=>resolve({type:file.type,data:r.result.split(",")[1],name:file.name}); r.readAsDataURL(file); };
    img.src = url;
  });
}
async function upload(key, files){
  const list = (st.f[key] ||= []);
  for (const file of files) {
    const entry = {name:file.name, state:T[st.lang].uploading, url:URL.createObjectURL(file)}; list.push(entry); uploadsPending++;
    refreshThumbs(key);
    try {
      const c = await compress(file);
      const r = await fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:st.id,field:key.replace(".","_"),name:c.name,type:c.type,data:c.data})});
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      entry.url = j.url; entry.name = j.name; delete entry.state;
    } catch(e) { entry.state = T[st.lang].failed; }
    uploadsPending--; refreshThumbs(key); save();
  }
}
function refreshThumbs(key){ const box = $(`[data-thumbs="${CSS.escape(key)}"]`); if (box) box.innerHTML = (st.f[key]||[]).map((f,i)=>thumbHTML(key,f,i)).join(""); }

async function submit(e){
  e.preventDefault(); collect();
  if (!validate()) return;
  const miss = S.findIndex(s => s.q.some(q => q.req && q.type!=="products" && !(Array.isArray(st.a[q.id]) ? st.a[q.id].length : (st.a[q.id] ?? q.v))));
  const missP = st.products.some(p => !p.name || !p.price);
  const target = miss >= 0 ? miss : (missP ? S.findIndex(s=>s.id==="products") : -1);
  if (target >= 0 && target !== st.step) { go(target); setTimeout(validate, 400); return; }
  if (uploadsPending) { toast(T[st.lang].waitUp); return; }
  const btn = $("#send"); btn.disabled = true; btn.textContent = T[st.lang].sending;
  const files = []; Object.entries(st.f).forEach(([k,arr]) => arr.forEach(f => { if (f.url && f.url.startsWith("http")) files.push({field:k,name:f.name,url:f.url}); }));
  const answers = {...st.a, products: st.products};
  try {
    const r = await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:st.id,lang:st.lang,answers,files})});
    if (!r.ok) throw new Error();
    st.sent = new Date().toISOString(); save();
    $("#steps").hidden = true; $("#intro").hidden = true; $("#prog").style.width="100%";
    $("#form").innerHTML = `<div class="done"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="#182B46"/></svg><h2 class="display" style="font-size:44px">${T[st.lang].doneTitle}</h2><p style="max-width:440px;font-size:17px;margin:0">${T[st.lang].doneText}</p><button type="button" class="btn btn-out" id="editagain">${T[st.lang].edit}</button></div>`;
    scrollTo({top:0,behavior:"smooth"});
  } catch(err) { btn.disabled=false; btn.textContent=T[st.lang].send+" →"; toast(T[st.lang].sendErr); }
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-lang]")) { collect(); st.lang = t.closest("[data-lang]").dataset.lang; save(); render(); }
  else if (t.closest("#next")) { collect(); if (validate()) { if(!st.done.includes(st.step)) st.done.push(st.step); go(st.step+1); } }
  else if (t.closest("#prev")) go(st.step-1);
  else if (t.closest("[data-step]")) go(+t.closest("[data-step]").dataset.step);
  else if (t.closest("#addprod")) { collect(); st.products.push({}); save(); render(); $$(".product").at(-1).scrollIntoView({behavior:"smooth"}); }
  else if (t.closest("[data-rmprod]")) { collect(); const i=+t.closest("[data-rmprod]").dataset.rmprod; st.products.splice(i,1);
      const nf={}; Object.entries(st.f).forEach(([k,v])=>{ const m=k.match(/^p(\d+)\.(.+)$/); if(!m) nf[k]=v; else if(+m[1]<i) nf[k]=v; else if(+m[1]>i) nf[`p${+m[1]-1}.${m[2]}`]=v; }); st.f=nf; save(); render(); }
  else if (t.closest("[data-rmfile]")) { const b=t.closest("[data-rmfile]"); st.f[b.dataset.rmfile].splice(+b.dataset.i,1); save(); refreshThumbs(b.dataset.rmfile); }
  else if (t.closest("#editagain")) { $("#steps").hidden=false; st.step=0; render(); }
});
document.addEventListener("change", e => { const f = e.target.closest("[data-file]"); if (f && f.files.length) { upload(f.dataset.file, [...f.files]); f.value=""; } else collect(); });
document.addEventListener("input", (() => { let t; return () => { clearTimeout(t); t=setTimeout(collect, 500); }; })());
$("#form").addEventListener("submit", submit);
addEventListener("pagehide", collect);
// drop stale "uploading" states from a previous visit
Object.values(st.f).forEach(arr => arr.forEach(f => { if (f.state) f.state = T[st.lang].failed; if (f.url && f.url.startsWith("blob:")) f.url = ""; }));
render(); if (st.a && Object.keys(st.a).length) save();
})();
</script>
</body>
</html>
