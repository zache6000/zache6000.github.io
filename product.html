<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produit — OFFGRID Streetwear</title>
<meta name="description" content="Hoodie oversize OFFGRID en coton premium. 280 MAD, livraison 48 h partout au Maroc, paiement à la livraison.">
<meta name="theme-color" content="#F2EADB">
<meta property="og:title" content="Produit — OFFGRID Streetwear">
<meta property="og:description" content="Hoodie oversize OFFGRID en coton premium. 280 MAD, livraison 48 h partout au Maroc, paiement à la livraison.">
<meta property="og:image" content="/assets/img/nf-model-back.webp">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try{var l=JSON.parse(localStorage.getItem("offgrid_lang")||'"fr"'),q=new URLSearchParams(location.search).get("lang");if(q)l=q;if(l==="ar"){document.documentElement.dir="rtl";document.documentElement.lang="ar"}else if(l==="en")document.documentElement.lang="en"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Noto+Kufi+Arabic:wght@400;600;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/i18n.js" defer></script>
<script src="/assets/js/products.js" defer></script>
<script src="/assets/js/app.js" defer></script>
</head>
<body data-solid="1">
<main id="main" class="container">
  <nav class="crumbs mono" aria-label="Breadcrumb"><a href="index.html" data-i18n="pdp.crumbs"></a><span>/</span><a href="shop.html" data-i18n="nav.shop"></a><span>/</span><span id="crumb"></span></nav>
  <div class="pdp" id="pdp"></div>
  <section style="padding-bottom:110px">
    <div class="section-head"><h2 class="display h-md" data-i18n="pdp.related"></h2><a class="btn btn-outline" href="shop.html" data-i18n="pdp.shopall"></a></div>
    <div class="grid grid-3" id="related"></div>
  </section>
</main>

<div class="sticky-buy" id="sticky-buy">
  <div><div style="font-weight:900" id="sb-name"></div><div class="mono" id="sb-price" style="opacity:.75"></div></div>
  <button class="btn btn-dark" type="button" id="sb-add" data-i18n="pdp.add"></button>
</div>

<div class="modal" id="size-modal" role="dialog" aria-modal="true" aria-labelledby="sg-title">
  <div class="modal-bg" data-close-modal></div>
  <div class="modal-card">
    <button class="icon-btn" type="button" data-close-modal data-i18n-aria="a11y.close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 class="display h-md" id="sg-title" data-i18n="sg.title"></h2>
    <p style="color:var(--muted)" data-i18n="sg.lede"></p>
    <table class="fit-table"><tbody>
      <tr><td data-i18n="sg.chest"></td><td>60 cm</td></tr>
      <tr><td data-i18n="sg.length"></td><td>68 cm</td></tr>
      <tr><td data-i18n="sg.shoulder"></td><td>60 cm</td></tr>
      <tr><td data-i18n="sg.sleeve"></td><td>59 cm</td></tr>
      <tr><td data-i18n="sg.hem"></td><td>50 cm</td></tr>
      <tr><td data-i18n="sg.hood"></td><td>38 cm</td></tr>
    </tbody></table>
    <p style="margin-bottom:0;font-size:15px" data-i18n="sg.note"></p>
  </div>
</div>

<script>
document.addEventListener("og:ready", () => {
  const { $, $$, P, C, esc, money, byId, img, I, L, t, Cart, toast, Lightbox, cardHTML, priceHTML, reveal } = OG;
  const p = byId(new URLSearchParams(location.search).get("id")) || P[0];
  const imgs = p.images.map(img);
  document.title = p.name + " — OFFGRID Streetwear";
  $("#crumb").textContent = p.name;
  let idx = 0, size = null, qty = 1;

  $("#pdp").innerHTML = `
    <div class="pdp-gallery">
      <div class="pdp-main" id="main-img" role="button" tabindex="0" aria-label="${esc(p.name)}">
        <img id="main-src" src="${imgs[0]}" alt="${esc(p.name)}">
        <span class="badge">${t("price.save")}</span>
        ${imgs.length > 1 ? `<button class="pdp-nav prev" type="button" aria-label="←">${I.left}</button>
        <button class="pdp-nav next" type="button" aria-label="→">${I.right}</button>
        <span class="pdp-count mono" id="img-count"></span>` : ""}
      </div>
      ${imgs.length > 1 ? `<div class="thumbs" id="thumbs">${imgs.map((s,i)=>`<button type="button" data-i="${i}" aria-label="${i+1}"><img src="${s}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
    </div>
    <div class="pdp-info">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span class="mono eyebrow">Hoodie oversize — ${esc(L(p.color))}</span>
        <h1 class="display h-lg">${esc(p.name)}</h1>
        <span class="mono" style="color:var(--muted)">${esc(L(p.tagline))}</span>
      </div>
      <div class="pdp-price">${priceHTML(p, true)}<span class="mono" style="display:flex;align-items:center;gap:8px"><span class="swatch" style="background:${p.color.hex}"></span>${esc(L(p.color))}</span></div>
      ${p.photos ? "" : `<div class="soon-note"><b>${t("pdp.soontitle")}</b><span>${t("pdp.soontxt")}</span></div>`}
      <p style="margin:0;font-size:17px;line-height:1.7">${esc(L(p.description))}</p>
      <div>
        <div class="opt-label"><span class="mono">${t("pdp.size")} — <span id="size-label">${t("pdp.choose")}</span></span><button class="link-btn mono" type="button" id="open-sg">${t("pdp.guide")}</button></div>
        <div class="sizes" id="sizes" role="group" aria-label="${t("pdp.size")}">${C.sizes.map(s=>`<button type="button" data-s="${s}" aria-pressed="false">${s}</button>`).join("")}</div>
      </div>
      <div class="buy-row">
        <div class="qty" role="group" aria-label="${t("pdp.qty")}"><button type="button" id="q-minus" aria-label="−">−</button><span id="q-val">1</span><button type="button" id="q-plus" aria-label="+">+</button></div>
        <button class="btn btn-dark" type="button" id="add">${t("pdp.add")}</button>
      </div>
      <button class="btn btn-outline btn-block" type="button" id="buy-now">${t("pdp.buy")}</button>
      <p class="mono stock-line"><span class="dot"></span>${t("pdp.stock")}</p>
      <div class="perks">
        <div class="perk">${I.cotton}<span>${t("pdp.perk1")}</span></div>
        <div class="perk">${I.fit}<span>${t("pdp.perk2")}</span></div>
        <div class="perk">${I.truck}<span>48 h · Maroc</span></div>
      </div>
      <div class="acc">
        <details open><summary>${t("pdp.details")}</summary><div class="acc-body"><ul><li>${t("pdp.d1")}</li><li>${t("pdp.d2")}</li><li>${t("pdp.d3")}</li><li>${t("pdp.d4")}</li></ul></div></details>
        <details><summary>${t("pdp.delivery")}</summary><div class="acc-body">${t("pdp.deliverytxt")}</div></details>
        <details><summary>${t("pdp.care")}</summary><div class="acc-body">${t("pdp.caretxt")}</div></details>
      </div>
    </div>`;

  const main = $("#main-src");
  function show(i) {
    idx = (i + imgs.length) % imgs.length;
    if (imgs.length < 2) return;
    main.style.opacity = 0;
    setTimeout(() => { main.src = imgs[idx]; main.style.opacity = 1; }, 160);
    $$("#thumbs button").forEach((b,j) => b.setAttribute("aria-current", j === idx));
    $("#img-count").textContent = (idx+1) + " / " + imgs.length;
  }
  show(0);
  if (imgs.length > 1) {
    $("#thumbs").onclick = e => { const b = e.target.closest("[data-i]"); if (b) show(+b.dataset.i); };
    $(".pdp-nav.prev").onclick = e => { e.stopPropagation(); show(idx-1); };
    $(".pdp-nav.next").onclick = e => { e.stopPropagation(); show(idx+1); };
  }
  let x0 = null, swiped = false;
  const openLb = () => { if (swiped) { swiped = false; return; } Lightbox.open(imgs, idx); };
  $("#main-img").onclick = openLb;
  $("#main-img").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(); } };
  $("#main-img").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; swiped = false; }, { passive: true });
  $("#main-img").addEventListener("touchend", e => { if (x0===null || imgs.length < 2) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) { swiped = true; const rtl = document.dir === "rtl"; show(idx + ((dx < 0) !== rtl ? 1 : -1)); } x0 = null; });

  $("#sizes").onclick = e => { const b = e.target.closest("[data-s]"); if (!b) return; size = b.dataset.s;
    $$("#sizes button").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#size-label").textContent = size; };
  $("#q-minus").onclick = () => { qty = Math.max(1, qty-1); $("#q-val").textContent = qty; };
  $("#q-plus").onclick = () => { qty = Math.min(10, qty+1); $("#q-val").textContent = qty; };
  function add() {
    if (!size) { const s = $("#sizes"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
      $("#size-label").textContent = t("pdp.chooseplease"); s.scrollIntoView({ behavior: "smooth", block: "center" }); return false; }
    Cart.add(p.id, size, qty); toast(`${p.name} · ${size} — ${t("toast.added")}`); return true;
  }
  $("#add").onclick = add;
  $("#sb-add").onclick = add;
  $("#buy-now").onclick = () => { if (add()) location.href = "checkout.html"; };

  $("#sb-name").textContent = p.name; $("#sb-price").textContent = money(p.price);
  const io = new IntersectionObserver(([en]) => $("#sticky-buy").classList.toggle("on", !en.isIntersecting && en.boundingClientRect.top < 0));
  io.observe($("#add"));

  const m = $("#size-modal");
  $("#open-sg").onclick = () => m.classList.add("on");
  m.addEventListener("click", e => { if (e.target.closest("[data-close-modal]")) m.classList.remove("on"); });

  $("#related").innerHTML = P.filter(x => x.id !== p.id).map(cardHTML).join("");
  reveal();
});
</script>
</body>
</html>
